<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="utf-8">
    <meta name="description" content="○○○○○○○○○○○○○○○○○○">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="https://unpkg.com/ress/dist/ress.min.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/reset.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Epilogue:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Epilogue:ital,wght@0,100..900;1,100..900&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
        rel="stylesheet">
    <link rel="icon" href="">
    <title>Cummo</title>
</head>

<body>

    <header></header>

    <nav class="sidebar__dark">
        <a class="logo" href="#">
            <img src="images/logo-dark.svg" alt="Cummo">
            <p class="logotype--dark">Cummo</p>
        </a>
        <ul class="icon__list">
            <li>
                <a href="#">
                    <img src="images/icon_dashboard-dark.svg" alt="dashboard">
                    <p class="icon__name--dark">Dashboard</p>
                </a>
            </li>
            <li class="posts__dark">
                <a href="#">
                    <img src="images/icon_posts-dark.svg" alt="">
                    <p class="icon__name--dark">Posts</p>
                </a>
            </li>
            <li>
                <a href="#">
                    <img src="images/icon_media-dark.svg" alt="">
                    <p class="icon__name--dark">Media</p>
                </a>
            </li>
            <li>
                <a href="#">
                    <img src="images/icon_pages-dark.svg" alt="">
                    <p class="icon__name--dark">Pages</p>
                </a>
            </li>
            <li class="comments">
                <a href="#">
                    <div class="comments__wrap">
                        <img src="images/icon_comments-dark.svg" alt="">
                        <p class="icon__name--dark">Comments</p>
                    </div>
                </a>
                <div class="unread__dark">
                    <p class="blue">1</p>
                </div>
            </li>
            <li>
                <a href="#">
                    <img src="images/icon_appearance-dark.svg" alt="">
                    <p class="icon__name--dark">Appearance</p>
                </a>
            </li>
            <li>
                <a href="#">
                    <img src="images/icon_plugins-dark.svg" alt="">
                    <p class="icon__name--dark">Plugins</p>
                </a>
            </li>
            <li>
                <a href="#">
                    <img src="images/icon_users-dark.svg" alt="">
                    <p class="icon__name--dark">Users</p>
                </a>
            </li>
            <li>
                <a href="#">
                    <img src="images/icon_settings-dark.svg" alt="">
                    <p class="icon__name--dark">Settings</p>
                </a>
            </li>
            <li>
                <a href="#">
                    <img src="images/icon_tools-dark.svg" alt="">
                    <p class="icon__name--dark">Tools</p>
                </a>
            </li>
        </ul>
        <ul class="setting__list">
            <li class="mode__settings">
                <div class="mode__settings--wrap">
                    <img src="images/icon_lightmode-dark.svg" alt="">
                    <p class="icon__name--dark">Light Mode</p>
                </div>
                <label class="toggle-button__dark">
                    <input type="checkbox" />
                </label>
            </li>
            <li class="logout">
                <a class="logout__a" href="#">
                    <img src="images/icon_logout-dark.svg" alt="">
                    <p class="icon__name--dark">Logout</p>
                </a>
            </li>
        </ul>
    </nav>

    <footer></footer>

</body>
