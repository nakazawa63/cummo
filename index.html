<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="utf-8">
    <meta name="description" content="○○○○○○○○○○○○○○○○○○">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="https://unpkg.com/ress/dist/ress.min.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/reset.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Epilogue:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Epilogue:ital,wght@0,100..900;1,100..900&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
        rel="stylesheet">
    <link rel="icon" href="">
    <title>Cummo</title>
</head>

<body>

    <header></header>

    <nav class="sidebar">
        <a class="logo" href="#">
            <picture>
                <!-- ダークモード用 -->
                <source srcset="images/logo-dark.svg" media="(prefers-color-scheme: dark)" />
                <!-- ライトモード用 -->
                <source srcset="images/logo-light.svg" />
                <img src="images/logo-light.svg" alt="" />
            </picture>
            <p class="logotype">Cummo</p>
        </a>
        <ul class="icon__list">
            <li>
                <a href="#">
                    <picture>
                        <!-- ダークモード用 -->
                        <source srcset="images/icon_dashboard-dark.svg" media="(prefers-color-scheme: dark)" />
                        <!-- ライトモード用 -->
                        <source srcset="images/icon_dashboard-light.svg" />
                        <img src="images/icon_dashboard-light.svg" alt="" />
                    </picture>
                    <p class="icon__name">Dashboard</p>
                </a>
            </li>
            <li class="posts">
                <a href="#">
                    <picture>
                        <!-- ダークモード用 -->
                        <source srcset="images/icon_posts-dark.svg" media="(prefers-color-scheme: dark)" />
                        <!-- ライトモード用 -->
                        <source srcset="images/icon_posts-light.svg" />
                        <img src="images/icon_posts-light.svg" alt="" />
                    </picture>
                    <p class="icon__name">Posts</p>
                </a>
            </li>
            <li>
                <a href="#">
                    <picture>
                        <!-- ダークモード用 -->
                        <source srcset="images/icon_media-dark.svg" media="(prefers-color-scheme: dark)" />
                        <!-- ライトモード用 -->
                        <source srcset="images/icon_media-light.svg" />
                        <img src="images/icon_media-light.svg" alt="" />
                    </picture>
                    <p class="icon__name">Media</p>
                </a>
            </li>
            <li>
                <a href="#">
                    <picture>
                        <!-- ダークモード用 -->
                        <source srcset="images/icon_pages-dark.svg" media="(prefers-color-scheme: dark)" />
                        <!-- ライトモード用 -->
                        <source srcset="images/icon_pages-light.svg" />
                        <img src="images/icon_pages-light.svg" alt="" />
                    </picture>
                    <p class="icon__name">Pages</p>
                </a>
            </li>
            <li class="comments">
                <a href="#">
                    <div class="comments__wrap">
                        <picture>
                            <!-- ダークモード用 -->
                            <source srcset="images/icon_comments-dark.svg" media="(prefers-color-scheme: dark)" />
                            <!-- ライトモード用 -->
                            <source srcset="images/icon_comments-light.svg" />
                            <img src="images/icon_comments-light.svg" alt="" />
                        </picture>
                        <p class="icon__name">Comments</p>
                    </div>
                </a>
                <div class="unread">
                    <p>1</p>
                </div>
            </li>
            <li>
                <a href="#">
                    <picture>
                        <!-- ダークモード用 -->
                        <source srcset="images/icon_appearance-dark.svg" media="(prefers-color-scheme: dark)" />
                        <!-- ライトモード用 -->
                        <source srcset="images/icon_appearance-light.svg" />
                        <img src="images/icon_appearance-light.svg" alt="" />
                    </picture>
                    <p class="icon__name">Appearance</p>
                </a>
            </li>
            <li>
                <a href="#">
                    <picture>
                        <!-- ダークモード用 -->
                        <source srcset="images/icon_plugins-dark.svg" media="(prefers-color-scheme: dark)" />
                        <!-- ライトモード用 -->
                        <source srcset="images/icon_plugins-light.svg" />
                        <img src="images/icon_plugins-light.svg" alt="" />
                    </picture>
                    <p class="icon__name">Plugins</p>
                </a>
            </li>
            <li>
                <a href="#">
                    <picture>
                        <!-- ダークモード用 -->
                        <source srcset="images/icon_users-dark.svg" media="(prefers-color-scheme: dark)" />
                        <!-- ライトモード用 -->
                        <source srcset="images/icon_users-light.svg" />
                        <img src="images/icon_users-light.svg" alt="" />
                    </picture>
                    <p class="icon__name">Users</p>
                </a>
            </li>
            <li>
                <a href="#">
                    <picture>
                        <!-- ダークモード用 -->
                        <source srcset="images/icon_settings-dark.svg" media="(prefers-color-scheme: dark)" />
                        <!-- ライトモード用 -->
                        <source srcset="images/icon_settings-light.svg" />
                        <img src="images/icon_settings-light.svg" alt="" />
                    </picture>
                    <p class="icon__name">Settings</p>
                </a>
            </li>
            <li>
                <a href="#">
                    <picture>
                        <!-- ダークモード用 -->
                        <source srcset="images/icon_tools-dark.svg" media="(prefers-color-scheme: dark)" />
                        <!-- ライトモード用 -->
                        <source srcset="images/icon_tools-light.svg" />
                        <img src="images/icon_tools-light.svg" alt="" />
                    </picture>
                    <p class="icon__name">Tools</p>
                </a>
            </li>
        </ul>
        <ul class="setting__list">
            <li class="mode__settings">
                <div class="mode__settings--wrap">
                    <picture>
                        <!-- ダークモード用 -->
                        <source srcset="images/icon_lightmode-dark.svg" media="(prefers-color-scheme: dark)" />
                        <!-- ライトモード用 -->
                        <source srcset="images/icon_darkmode-light.svg" />
                        <img src="images/icon_darkmode-light.svg" alt="" />
                    </picture>
                    <p class="icon__name">Dark Mode</p>
                </div>
                <label class="toggle-button">
                    <input type="checkbox" />
                </label>
            </li>
            <li class="logout">
                <a class="logout__a" href="#">
                    <img src="images/icon_logout-dark.svg" alt="">
                    <p class="icon__name">Logout</p>
                </a>
            </li>
        </ul>
    </nav>

    <footer></footer>

</body>
